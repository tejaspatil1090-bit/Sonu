<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>For Sonu 💗🧿</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
    }
    .card {
      background: rgba(255,255,255,0.18);
      padding: 35px;
      border-radius: 22px;
      max-width: 420px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.35);
    }
    h1 {
      margin-bottom: 10px;
      font-size: 28px;
    }
    h2 {
      margin-bottom: 20px;
      font-weight: normal;
    }
    p {
      font-size: 18px;
      line-height: 1.7;
    }
    .heart {
      font-size: 26px;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hey Sonu 💗🧿</h1>
    <h2>One last note…</h2>
    <p>
      Even after fights,<br>
      even after silence,<br>
      I still choose you<br>
      every single day.<br><br>
      I hope this makes you smile 😊
    </p>
    <div class="heart">❤️</div>
  </div>
</body>
</html>
